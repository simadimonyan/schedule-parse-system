spring.application.name=schedule-parse-service

# /schedule - for production
server.servlet.context-path=/

spring.datasource.url=jdbc:postgresql://app_db:5432/schedule
spring.datasource.username=root
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=admin

# Срок жизни записей кеша. Явные сбросы (@CacheEvict, смена чётности недели, события
# мастер-сервиса) остаются основным способом обновления — TTL страхует от записей,
# до которых сброс не дошёл. Час выбран под TTL общего кеша мастер-сервиса.
spring.cache.redis.time-to-live=${CACHE_TTL:1h}

# Redis общий на весь стек: свои ключи отделяются префиксом сервиса, чтобы регион
# groups не столкнулся с одноимённым у соседа. Итоговый ключ: schedule:groups::ПИ-301
spring.cache.redis.key-prefix=${CACHE_PREFIX:schedule:}

# MinIO service
minio.url=http://minio:9000
minio.access.key=H2YWAZS72EJR8QYRYX51
minio.secret.key=ejaedWTksdirmFbTHH0zEQ98xNQ7OZm6BD3hvNz9

# Загрузка файла расписания из личного кабинета (POST /api/v1/schedule/schedule/upload).
# По умолчанию Spring пускает 1 МБ на файл, а недельное расписание курса — это 2-6 МБ:
# отказ приходил бы как 500 без внятной причины. Потолок выбран с запасом, но конечный:
# бакет расписания не место для произвольных файлов.
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:25MB}

# External Sources
external.server.url=https://imsit.ru/timetable/raspisProg/public/index.php

# Master service (справочник групп и преподавателей ISMS)
master.service.url=${MASTER_SERVICE_URL:http://master-service:8080}
master.service.timeout.seconds=${MASTER_SERVICE_TIMEOUT:10}
# факультета в файле расписания нет, а мастеру он обязателен при создании группы
master.default.faculty.id=${MASTER_DEFAULT_FACULTY_ID:1}
# корпус для аудиторий, записанных без префикса («114а» вместо «1-114а»)
master.default.block.id=${MASTER_DEFAULT_BLOCK_ID:1}
master.kafka.topic=${MASTER_CACHE_TOPIC:redis-cache-process}

# Удостоверение для вызовов мастера. Пока KEYCLOAK_CLIENT_SECRET пуст, сервис ходит
# со старым общим секретом (или вовсе без него) — см. MasterServiceConfiguration
master.auth.legacy-token=${MASTER_LEGACY_TOKEN:}
spring.security.oauth2.client.registration.master.provider=keycloak
spring.security.oauth2.client.registration.master.client-id=${KEYCLOAK_CLIENT_ID:schedule-service}
spring.security.oauth2.client.registration.master.client-secret=${KEYCLOAK_CLIENT_SECRET:}
spring.security.oauth2.client.registration.master.authorization-grant-type=client_credentials
# Только token-uri: для client_credentials остальные адреса не нужны, и сервис не ходит
# за OIDC-манифестом на старте — Keycloak может подняться позже
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://keycloak:8080/realms/schedule/protocol/openid-connect/token}

# Проверка входящих токенов — тот же приём, что у шлюза: issuer-uri публичный (с ним
# сверяется claim iss в токене), jwk-set-uri внутренний (по нему берутся ключи подписи).
# Заданы оба, поэтому за OIDC-манифестом на старте сервис не ходит и поднимается
# независимо от Keycloak. Если задать только issuer-uri, Spring скачает манифест и
# сверит issuer, а Keycloak за KC_HOSTNAME отдаёт localhost:9990 — старт упадёт с
# «The Issuer ... did not match the requested issuer».
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:9990/realms/schedule}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/schedule/protocol/openid-connect/certs}

# Kafka (объявления мастер-сервиса об изменении справочников)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
# Топик собственных событий расписания — отдельный от чужого redis-cache-process:
# там справочники мастера, здесь наши версии, изменения и сетка
schedule.kafka.topic=${SCHEDULE_EVENTS_TOPIC:schedule-events}
spring.kafka.consumer.group-id=schedule-service
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.listener.missing-topics-fatal=false
# незнакомый тип сущности в событии мастера не должен ронять слушателя
spring.jackson.deserialization.read-unknown-enum-values-using-default-value=true

