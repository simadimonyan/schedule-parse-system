schedule.admin.token=1fcb4a25fd239ea5f96f443b697dc69a10696d8860fd434277f90f7ed989bfd0

springdoc.swagger-ui.path=/
springdoc.swagger-ui.enabled=true
server.forward-headers-strategy=framework

eureka.client.service-url.defaultZone=http://discovery-service:8080/eureka/
# В Docker имя инстанса — короткий id контейнера; регистрация по IP убирает зависимость
# маршрутизации gateway от того, резолвится ли это имя
eureka.instance.prefer-ip-address=true
discovery.service.company-service-uri=http://schedule-service/

otel.logs.exporter=otlp
otel.exporter.otlp.logs.protocol=http/protobuf
otel.service.name=schedule-parse-service
otel.exporter.otlp.endpoint=http://open-telemetry:4318

management.metrics.enable.all=true
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=http://open-telemetry:4318/v1/metrics
management.metrics.tags.application=schedule-parse-service

logging.level.io.opentelemetry=DEBUG
# Origin'ы, которым разрешён браузерный доступ (личный кабинет и просмотрщик). Задаётся
# переменной SCHEDULE_ALLOWED_ORIGINS; по умолчанию — только прод-домены. Стенд без этой
# переменной получает 403 от CorsFilter, и выглядит это как нехватка прав
schedule.allowed-origins=${SCHEDULE_ALLOWED_ORIGINS:https://myimsit.ru,https://app.myimsit.ru}
