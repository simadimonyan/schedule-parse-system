
# App-only include for the production aggregator (configs/production/compose.prod.yaml).
# Infrastructure (app_db, minio, redis, clickhouse, otel, grafana, nginx, ...) is
# provided by the aggregator. This file only contributes the schedule application
# container. Relative paths here resolve against THIS directory (docker compose
# `include` semantics), so build context "." == services/schedule-service.

services:

  schedule_app:
    container_name: schedule-service
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/service/schedule-service
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - app_db
      - otel-collector
    environment:
      # справочник групп и преподавателей: master-service в общей сети schedule_net
      - MASTER_SERVICE_URL=${MASTER_SERVICE_URL:-http://master-service:8080}
      - MASTER_DEFAULT_FACULTY_ID=${MASTER_DEFAULT_FACULTY_ID:-1}
      - MASTER_DEFAULT_BLOCK_ID=${MASTER_DEFAULT_BLOCK_ID:-1}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}

      # Удостоверение для вызовов мастера — docs/infrastructure/service-auth.md.
      # Пока SCHEDULE_KEYCLOAK_CLIENT_SECRET пуст, ходим переходным общим секретом
      - KEYCLOAK_CLIENT_ID=${SCHEDULE_KEYCLOAK_CLIENT_ID:-schedule-service}
      - KEYCLOAK_CLIENT_SECRET=${SCHEDULE_KEYCLOAK_CLIENT_SECRET:-}
      - KEYCLOAK_TOKEN_URI=${KEYCLOAK_TOKEN_URI:-http://keycloak:8080/realms/schedule/protocol/openid-connect/token}
      - MASTER_LEGACY_TOKEN=${MASTER_LEGACY_TOKEN:-}

      - TZ=Europe/Moscow
    dns:
      - 8.8.8.8
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: 1
    networks:
      - schedule_net

  app_db:
    image: postgres:18.4
    container_name: schedule-service-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # в PG18 дефолтный PGDATA — /var/lib/postgresql/<major>/docker;
      # задаём явно, чтобы смена мажора не переносила каталог данных
      - PGDATA=/var/lib/postgresql/data

      - TZ=Europe/Moscow
    volumes:
      - ./volumes/app_db/postgres:/var/lib/postgresql/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5432:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: 1
    networks:
      - schedule_net
