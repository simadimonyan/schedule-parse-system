events {
    worker_connections 1024;
}

http {
    server_tokens off;

    server {
        listen 80;
        server_name myimsit.ru;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 200 'ok';
        }
    }

    server {
        listen 80;
        server_name api.myimsit.ru;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 200 'ok';
        }
    }

    server {
        listen 80;
        server_name admin.myimsit.ru;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 200 'ok';
        }
    }
}
