events {
    worker_connections 1024;
}

stream {
    limit_conn_zone $binary_remote_addr zone=stream_conn_limit_per_ip:10m;

    server {
        listen 6379;
        proxy_pass redis:6379;
        proxy_connect_timeout 30s;
        proxy_timeout 30s;
        limit_conn stream_conn_limit_per_ip 2;
    }
}

http {
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ===== ОСНОВНОЙ ДОМЕН myimsit.ru =====
    server {
        listen 80;
        server_name myimsit.ru;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://myimsit.ru$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name myimsit.ru;
        
        ssl_certificate /etc/nginx/ssl/myimsit.ru/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/myimsit.ru/privkey.pem;
        
        # Добавьте контент для основного домена
        location / {
            # Пример: статический сайт
            # root /var/www/myimsit;
            # index index.html;
            # Или прокси на бэкенд
            # proxy_pass http://app:8080;
            # Или просто заглушка
            return 200 'Основной домен myimsit.ru работает';
            add_header Content-Type text/plain;
        }
    }

    # ===== ПОДДОМЕН API =====
    server {
        listen 80;
        server_name api.myimsit.ru;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://api.myimsit.ru$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name api.myimsit.ru;

        ssl_certificate /etc/nginx/ssl/api.myimsit.ru/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/api.myimsit.ru/privkey.pem;

        location /schedule/ {
            limit_req zone=req_limit_per_ip burst=10 nodelay;
            proxy_cache_valid 200 10m; 
            
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
        
        location / {
            return 404;
        }
    }

    # ===== ПОДДОМЕН АДМИНКИ =====
    server {
        listen 80;
        server_name admin.myimsit.ru;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://admin.myimsit.ru$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name admin.myimsit.ru;

        ssl_certificate /etc/nginx/ssl/admin.myimsit.ru/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/admin.myimsit.ru/privkey.pem;

        location /console/ {
            limit_req zone=req_limit_per_ip burst=10 nodelay;
            rewrite ^/console/(.*)$ /$1 break;
            proxy_pass http://minio:9001;
            
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }

        location /pgadmin/ {
            limit_req zone=req_limit_per_ip burst=10 nodelay;
            rewrite ^/pgadmin/(.*)$ /$1 break;
            proxy_pass http://pgadmin:80;
            
            proxy_set_header Host $host;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /grafana/ {
            limit_req zone=req_limit_per_ip burst=10 nodelay;
            proxy_pass http://grafana:3000;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Server $host;
        }

        location / {
            limit_req zone=req_limit_per_ip burst=10 nodelay;
            proxy_pass http://hyperdx-ui:8081;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }
    }
}